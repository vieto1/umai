<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf4ec"><title>UMAI · App aktualisieren</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#faf4ec;color:#2e2924;font:16px system-ui,sans-serif;padding:24px}main{max-width:450px;width:100%;background:#fff;border:1px solid #eee1d5;border-radius:20px;padding:28px;box-shadow:0 14px 55px #38281b12}h1{font:500 38px Georgia,serif;margin:0 0 14px}p{line-height:1.6;color:#6e6259}button{background:#ae351d;color:white;border:0;border-radius:28px;padding:14px 24px;font:600 15px system-ui;cursor:pointer;width:100%}button:disabled{opacity:.6}small{display:block;margin-top:16px;color:#796c61;line-height:1.5}#status{min-height:24px}</style></head><body><main><h1>umai<span style="color:#ae351d">.</span></h1><h2>App-Version reparieren</h2><p>Falls dein iPhone noch das alte Design zeigt, entferne hier die alten Offline-Dateien. Deine gespeicherten Rezepte und Einstellungen bleiben erhalten.</p><button id="fix" type="button">Alte App-Version entfernen &amp; neu laden</button><p id="status" role="status" aria-live="polite"></p><small>Benötigt eine Internetverbindung. Öffne diese Seite in Safari, wenn die installierte App nicht aktualisiert wird.</small></main><script>document.getElementById('fix').addEventListener('click',async()=>{const b=document.getElementById('fix'),s=document.getElementById('status');b.disabled=true;s.textContent='Offline-Dateien werden zurückgesetzt …';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.startsWith(new URL('./',location.href).href)).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/umai|washi|recipe|shell|static|precache|workbox/i.test(k)).map(k=>caches.delete(k)))}s.textContent='Fertig. Neue Version wird geladen …';location.replace('./index.html?fresh='+Date.now())}catch(e){s.textContent='Zurücksetzen nicht vollständig möglich. Bitte erneut versuchen.';b.disabled=false}});</script></body></html>
